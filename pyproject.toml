[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "terminal-tiger"
dynamic = ["version"]
description = "Photographic, animated portraits for your terminal and your AI coding agents (Claude Code, Codex, Gemini CLI)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "CREDITS.md"]
requires-python = ">=3.9"
authors = [{ name = "Josh Ogden" }]
keywords = ["terminal", "ansi", "cli", "truecolor", "ascii-art", "motd", "shell", "tiger",
            "claude-code", "codex", "gemini-cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Artistic Software",
  "Topic :: Terminals",
]
dependencies = [
  "pillow>=9.1",
  "numpy>=1.21",
  "tomli>=1.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://joshogden360.github.io/terminal-tiger/"
Source = "https://github.com/joshogden360/terminal-tiger"
Issues = "https://github.com/joshogden360/terminal-tiger/issues"

[project.scripts]
terminal-tiger = "terminal_tiger:main"
tiger = "terminal_tiger:main"

[dependency-groups]
dev = ["pytest>=7", "pyte>=0.8"]

[tool.hatch.version]
path = "terminal_tiger.py"

[tool.hatch.build.targets.wheel]
only-include = ["terminal_tiger.py"]

[tool.hatch.build.targets.sdist]
include = ["terminal_tiger.py", "README.md", "LICENSE", "CREDITS.md", "examples/", "tests/", "tools/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
